<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestió Projectes Globalitzats</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body class="gp-body gp-app">
  <a class="gp-skip-link" href="#app">Salta al contingut</a>
  <div class="gp-bg" aria-hidden="true"></div>

  <div class="gp-shell">
    <!-- Sidebar desktop + offcanvas mòbil -->
    <aside id="sidebar" class="gp-sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-label="Navegació principal">
      <div class="offcanvas-body" id="sidebar-body"></div>
    </aside>

    <div class="gp-main">
      <div class="gp-main-col">
        <!-- Topbar només mòbil/tablet: obre offcanvas -->
        <div class="gp-topbar d-lg-none">
          <button class="gp-menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Obre el menú">
            <span class="gp-menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
            <span class="gp-menu-text">Menú</span>
          </button>
          <span class="gp-brand-text fw-bold">Projectes Globalitzats</span>
        </div>

        <main class="gp-content" id="main-content">
          <div id="alerts" aria-live="polite"></div>
          <div id="app" class="gp-enter-fade"></div>
        </main>

        <footer class="gp-footer">
          <span>Sprint 1.1-JS · M0612 · HTML + JS vanilla · fetch + JSON + localStorage</span>
        </footer>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
